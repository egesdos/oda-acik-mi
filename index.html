<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Oda Aktiflik</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8a8a;
    --line: #2e2e2e;
    --field: #0e0e0e;
    --online: #22c55e;
    --offline: #ef4444;
    --font: "Silkscreen", "Courier New", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    text-transform: uppercase;
    -webkit-font-smoothing: none;
    padding:
      max(28px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
  }
  button, input, input::placeholder { text-transform: uppercase; }
  [hidden] { display: none !important; }

  header { display: flex; justify-content: center; }
  .logo { width: min(80vw, 340px); height: auto; display: block; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-block: 32px;
    text-align: center;
  }
  .label { font-size: 1rem; letter-spacing: .08em; color: var(--muted); }
  .state { font-weight: 700; font-size: clamp(2.5rem, 14vw, 5rem); line-height: 1; color: var(--muted); transition: color .25s; }
  .state.on { color: var(--online); }
  .state.off { color: var(--offline); }

  /* itch.io only shows the full layout at 552px, so the widget is scaled down to fit narrow screens */
  .game { width: 100%; max-width: 552px; height: 167px; margin: 0 auto 20px; overflow: hidden; }
  .game iframe { display: block; width: 552px; height: 167px; border: 0; transform-origin: 0 0; }

  footer { width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  form { display: flex; flex-direction: column; gap: 12px; margin: 0; }
  .btn {
    appearance: none;
    width: 100%;
    min-height: 76px;
    border: 2px solid var(--fg);
    border-radius: 0;
    background: var(--fg);
    color: var(--bg);
    font: 700 clamp(1.5rem, 7.5vw, 2rem) var(--font);
    letter-spacing: .04em;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .08s, opacity .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; }
  input {
    width: 100%;
    min-height: 56px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--field);
    color: var(--fg);
    font: 400 16px var(--font);
  }
  input::placeholder { color: var(--muted); }
  .link {
    align-self: center;
    padding: 8px 12px;
    border: 0;
    background: none;
    color: var(--muted);
    font: 400 .9rem var(--font);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .btn:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .msg { margin: 0; color: var(--offline); font-size: .95rem; text-align: center; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="logo.webp" alt="DOGDOK">
  </header>

  <main aria-live="polite">
    <div class="label">Oda Aktiflik</div>
    <div id="state" class="state">…</div>
  </main>

  <section class="game">
    <iframe src="https://itch.io/embed/5024285?bg_color=0a1f3c&amp;fg_color=dce8f2&amp;link_color=7ad0cc&amp;border_color=354259" title="Skibidi Stones" width="552" height="167" loading="lazy"><a href="https://egesdos.itch.io/skibidi-stones">Skibidi Stones by egesdos, KadirToptas</a></iframe>
  </section>
  <script>
    (() => {
      const game = document.querySelector(".game");
      const frame = game.querySelector("iframe");
      const fit = () => {
        const scale = Math.min(1, game.clientWidth / 552);
        frame.style.transform = "scale(" + scale + ")";
        game.style.height = 167 * scale + "px";
      };
      fit();
      window.addEventListener("resize", fit);
      if (window.ResizeObserver) new ResizeObserver(fit).observe(game);
    })();
  </script>

  <footer>
    <button id="toggle" class="btn" type="button" hidden>Odayi Ac</button>
    <form id="login" hidden>
      <input id="password" type="password" placeholder="Yetkili sifresi" autocomplete="current-password" required>
      <button class="btn" type="submit">Giris yap</button>
    </form>
    <p id="msg" class="msg" hidden></p>
    <button id="logout" class="link" type="button" hidden>Cikis yap</button>
  </footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyA2yeQkJhhduD9ia6H9lC9TQu5jjPDixAc",
    authDomain: "oda-acik-mi.firebaseapp.com",
    databaseURL: "https://oda-acik-mi-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "oda-acik-mi",
    appId: "1:43946166857:web:149e0d731e2a6e4703cd98"
  });
  const ADMIN_EMAIL = "ytudogdok@gmail.com";

  const db = getDatabase(app);
  const auth = getAuth(app);
  const statusRef = ref(db, "status");
  const $ = (id) => document.getElementById(id);

  let isOpen = null;
  let signedIn = false;

  function render() {
    const st = $("state");
    st.className = "state" + (isOpen === null ? "" : isOpen ? " on" : " off");
    st.textContent = isOpen === null ? "…" : isOpen ? "ONLINE" : "OFFLINE";
    $("toggle").textContent = isOpen ? "Odayi Kapa" : "Odayi Ac";
    $("toggle").hidden = !signedIn || isOpen === null;
    $("logout").hidden = !signedIn;
    $("login").hidden = signedIn || location.hash !== "#yetkili";
  }

  function showMsg(text) {
    $("msg").textContent = text || "";
    $("msg").hidden = !text;
  }

  onValue(
    statusRef,
    (snap) => { isOpen = snap.val() === true; render(); },
    () => { $("state").textContent = "—"; showMsg("Durum okunamadi, sayfayi yenile."); }
  );
  onAuthStateChanged(auth, (user) => { signedIn = !!user; render(); });
  window.addEventListener("hashchange", render);

  $("toggle").addEventListener("click", async () => {
    $("toggle").disabled = true;
    showMsg("");
    try {
      await set(statusRef, !isOpen);
    } catch (e) {
      const denied = /permission/i.test(String(e?.code || e?.message || ""));
      showMsg(denied ? "Bu hesabin durumu degistirme yetkisi yok." : "Kaydedilemedi, interneti kontrol edip tekrar dene.");
    } finally {
      $("toggle").disabled = false;
    }
  });

  $("login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    showMsg("");
    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $("password").value);
      $("password").value = "";
      history.replaceState(null, "", location.pathname + location.search);
    } catch (e) {
      if (e?.code === "auth/too-many-requests") showMsg("Cok fazla deneme yapildi, biraz bekleyip tekrar dene.");
      else if (e?.code === "auth/network-request-failed") showMsg("Internet baglantisi yok.");
      else showMsg("Sifre yanlis.");
    }
    render();
  });

  $("logout").addEventListener("click", () => {
    showMsg("");
    signOut(auth);
  });

  render();
</script>
</body>
</html>
